</div>
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="universityEmail">
<span class="">이메일</span>

</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-lg pointer-events-none">school</span>
<input autocomplete="email" class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface outline-none focus:bg-surface-container-lowest transition-all shadow-sm" id="universityEmail" placeholder="name@university.ac.kr" required="" type="email" value="joonhyuk@university.ac.kr">
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="passwordField">비밀번호</label>

</div>

<input autocomplete="current-password" class="w-full pl-10 pr-11 py-3 bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface outline-none focus:bg-surface-container-lowest transition-all shadow-sm" id="passwordField" required="" type="password" value="AcornSecure2024!">
<button aria-label="비밀번호 표시 토글" class="absolute right-2.5 p-1.5 text-outline hover:text-on-surface rounded-full flex items-center justify-center transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">

</div>

<button class="w-full py-3.5 bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-lg shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-1" id="submitButton" type="submit">

<a class="text-primary font-headline-sm text-headline-sm underline underline-offset-4 hover:text-primary-container transition-colors" href="#">
            회원가입

</div>

<span class="inline-block w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="hover:text-on-surface transition-colors" href="#">개인정보처리방침</a>
<span class="inline-block w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="hover:text-on-surface transition-colors" href="#">캠퍼스 인증 안내</a>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordField');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLoginSubmit() {
    const errorBox = document.getElementById('loginErrorMessage');
    if (!errorBox) return;
    
    errorBox.classList.remove('opacity-0', 'pointer-events-none');
    errorBox.classList.add('opacity-100');
  }
</script></main>
